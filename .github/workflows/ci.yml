name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Build web app
        run: npm run build:web
      - name: Download PocketBase
        run: |
          curl -sL -o /tmp/pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.30.4/pocketbase_0.30.4_linux_amd64.zip
          unzip -o /tmp/pb.zip -d /tmp/pb
      - name: Server-rule e2e (throwaway PocketBase)
        run: PB_BIN=/tmp/pb/pocketbase npm run test:e2e
